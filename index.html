<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="声账" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>声账</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div>
        <div class="eyebrow">有声书</div>
        <h1>声账</h1>
      </div>
      <button class="icon-btn" id="installBtn" type="button" hidden aria-label="安装到主屏幕">⇩</button>
    </header>

    <main>
      <section class="view active" id="view-home" aria-labelledby="tab-home">
        <div class="summary-grid" id="homeSummary"></div>

        <div class="section-block">
          <div class="section-head">
            <div>
              <h2>正在做的书</h2>
              <p>简称自动归到正式书名</p>
            </div>
            <button class="text-btn" id="newProjectFromHome" type="button">新建</button>
          </div>
          <div id="activeProjectList" class="project-list"></div>
        </div>

        <div class="section-block">
          <div class="section-head">
            <div>
              <h2>今天的记录</h2>
              <p>只统计今天导入的正式成品</p>
            </div>
          </div>
          <div id="todayRecordList" class="record-list"></div>
        </div>
      </section>

      <section class="view" id="view-books" aria-labelledby="tab-books">
        <div class="page-title-row">
          <div>
            <div class="eyebrow">项目归档</div>
            <h2 class="page-title">书库</h2>
          </div>
          <button class="primary-mini" id="newProjectBtn" type="button">＋ 新建</button>
        </div>
        <div id="allProjectList" class="project-list"></div>
      </section>

      <section class="view" id="view-import" aria-labelledby="tab-import">
        <div class="page-title-row">
          <div>
            <div class="eyebrow">正式成品</div>
            <h2 class="page-title">导入</h2>
          </div>
        </div>

        <button class="import-card" id="chooseAudioBtn" type="button">
          <span class="import-plus">＋</span>
          <strong>选择 MP3</strong>
          <span>一次可以选多个文件</span>
        </button>
        <input id="audioInput" type="file" accept="audio/mpeg,.mp3" multiple hidden />

        <div id="importPreview" class="import-preview"></div>
        <button class="primary-wide" id="confirmImportBtn" type="button" hidden>确认导入</button>
      </section>

      <section class="view" id="view-stats" aria-labelledby="tab-stats">
        <div class="page-title-row">
          <div>
            <div class="eyebrow">工作统计</div>
            <h2 class="page-title">统计</h2>
          </div>
        </div>
        <div class="summary-grid" id="statsSummary"></div>

        <div class="section-block no-pad-top">
          <div class="section-head">
            <div>
              <h2>本月书目</h2>
              <p>按本月成品时长汇总</p>
            </div>
          </div>
          <div id="monthProjectStats" class="record-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-view="home" id="tab-home" type="button"><span>⌂</span><b>首页</b></button>
      <button class="nav-item" data-view="books" id="tab-books" type="button"><span>▤</span><b>书库</b></button>
      <button class="nav-item nav-import" data-view="import" id="tab-import" type="button"><span>＋</span><b>导入</b></button>
      <button class="nav-item" data-view="stats" id="tab-stats" type="button"><span>◫</span><b>统计</b></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="projectSheet" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="projectSheetTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h3 id="projectSheetTitle">新建有声书</h3>
        <button class="close-btn" data-close="projectSheet" type="button">关闭</button>
      </div>
      <form id="projectForm" class="form-stack">
        <input type="hidden" id="projectId" />
        <label>正式书名<input id="projectTitle" autocomplete="off" placeholder="例如：双修之天下第一" required /></label>
        <label>文件名简称<input id="projectAliases" autocomplete="off" placeholder="例如：双修；多个简称用逗号分开" required /></label>
        <label>甲方<input id="projectClient" autocomplete="off" placeholder="合作方名称" /></label>
        <div class="two-col">
          <label>平台<select id="projectPlatform">
            <option value="喜马拉雅">喜马拉雅</option>
            <option value="番茄畅听">番茄畅听</option>
            <option value="懒人听书">懒人听书</option>
            <option value="蜻蜓FM">蜻蜓FM</option>
            <option value="微信听书">微信听书</option>
            <option value="其他" selected>其他</option>
          </select></label>
          <label>项目状态<select id="projectStatus">
            <option value="连载中">连载中</option>
            <option value="已完结">已完结</option>
            <option value="暂停">暂停</option>
          </select></label>
        </div>
        <div class="two-col">
          <label>角色类型<select id="projectRoleType">
            <option value="男主">男主</option>
            <option value="男配">男配</option>
            <option value="旁白">旁白</option>
            <option value="其他">其他</option>
          </select></label>
          <label>角色名<input id="projectRoleName" autocomplete="off" placeholder="角色名" /></label>
        </div>
        <label>单价（元 / 成品小时）<input id="projectRate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="250" /></label>
        <button class="primary-wide" type="submit">保存项目</button>
      </form>
    </section>
  </div>

  <div class="sheet-backdrop" id="detailSheet" aria-hidden="true">
    <section class="sheet sheet-tall" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="sheet-grabber"></div>
      <div id="projectDetail"></div>
    </section>
  </div>

  <div class="sheet-backdrop" id="settlementSheet" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settlementSheetTitle">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <h3 id="settlementSheetTitle">新增结算</h3>
        <button class="close-btn" data-close="settlementSheet" type="button">关闭</button>
      </div>
      <form id="settlementForm" class="form-stack">
        <input type="hidden" id="settlementProjectId" />
        <label>结算到第几集<input id="settledThrough" type="number" inputmode="numeric" min="1" step="1" required /></label>
        <label>本次实际结算金额（元）<input id="settledAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" required /></label>
        <label>结算日期<input id="settledDate" type="date" required /></label>
        <button class="primary-wide" type="submit">保存结算</button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
